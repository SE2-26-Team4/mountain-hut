# Check both keys in SonarQube Cloud on Project > Information
sonar.organization=se2-26-team4
sonar.projectKey=SE2-26-Team4_mountain-hut

# Source code
sonar.sources=client/src,server
sonar.exclusions=server/tests/**,server/coverage/**,server/node_modules/**

# Test code
sonar.tests=server/tests

# Coverage
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
sonar.coverage.exclusions=server/index.js,server/vitest.config.js

sonar.sourceEncoding=UTF-8
