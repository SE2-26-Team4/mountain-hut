services:
  app:
    container_name: mountain_hut_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /app/data/mountain-hut.sqlite
      SESSION_SECRET: ${SESSION_SECRET:-mountain-hut-local-development-secret}
      COOKIE_SECURE: "false"
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-true}
    volumes:
      - mountain_hut_sqlite_data:/app/data
    restart: unless-stopped

volumes:
  mountain_hut_sqlite_data:
