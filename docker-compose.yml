services:
  app:
    container_name: mountain_hut_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ${ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PORT: 8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DB_PATH: /app/data/mountain-hut.sqlite
      COOKIE_SECURE: "false"
    volumes:
      - mountain_hut_sqlite_data:/app/data
    restart: unless-stopped

volumes:
  mountain_hut_sqlite_data:
